[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recache-probe"
version = "0.1.0"
description = "Measure CPython regex-cache re-entry tax per pattern"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]

[tool.setuptools]
packages = ["recache_probe"]
